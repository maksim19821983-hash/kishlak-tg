<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Unbounded'; src:url('../assets/unbounded.ttf'); font-weight:100 900; }
  @font-face { font-family:'JB'; src:url('../assets/jbmono-regular.ttf'); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B0B0C;padding:40px 28px;display:flex;gap:24px;justify-content:center}
  .wrap{width:390px;display:flex;flex-direction:column;gap:10px}
  .cap{font:11px/1.3 'JB';letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a}
  .phone{padding-top:12px}
  .paper{background:#EDE7DC;color:#131211;--body:#1E1C1A;--bodyText:#F1EDE6;--bodyDim:rgba(241,237,230,.5);--dim:rgba(19,18,17,.55)}
  .dark{background:#0B0B0C;color:#F1EDE6;--body:#E4DED2;--bodyText:#131211;--bodyDim:rgba(19,18,17,.55);--dim:rgba(241,237,230,.5)}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding:0 24px 12px}
  .word{font:600 11px/1 'JB';letter-spacing:.16em}
  .num{font:400 11px/1 'JB';color:var(--dim);letter-spacing:.1em}
  .cass{margin:0 24px 22px;background:var(--body);border-radius:10px;padding:13px 14px 14px;color:var(--bodyText)}
  .row{display:flex;justify-content:space-between;align-items:center}
  .mono{font:600 9px/1 'JB';letter-spacing:.18em;text-transform:uppercase}
  .monoDim{font:400 9px/1 'JB';color:var(--bodyDim);letter-spacing:.18em}
  .tech{font:600 13px/1.25 'JB';letter-spacing:.1em;text-transform:uppercase;margin:12px 0 0}
  .win{height:78px;background:rgba(0,0,0,.45);border-radius:6px;display:flex;align-items:center;gap:13px;padding:0 16px;margin:10px 0 0}
  .dark .win{background:rgba(19,18,17,.12)}
  .full{width:52px;height:52px;border-radius:50%;background:#8C5334;display:grid;place-items:center}
  .empty{width:26px;height:26px;border-radius:50%;border:2px solid #8C5334}
  .hub{width:14px;height:14px;border-radius:50%;background:var(--body)}
  .tape{flex:1;height:2px;background:#8C5334}
  .bar{margin:0 24px;height:3px;background:rgba(19,18,17,.14);position:relative}
  .dark .bar{background:rgba(241,237,230,.16)}
  .bar i{position:absolute;inset:0 auto 0 0;width:38%;background:#B47F64}
  .times{display:flex;justify-content:space-between;font:400 11px/1 'JB';color:var(--dim);padding:8px 24px 0}
  .tr{display:flex;align-items:center;justify-content:space-between;padding:20px 40px 26px}
  .pb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#131211}
  .dark .pb{background:#F1EDE6}
  .tri{width:0;height:0;border-left:14px solid #EDE7DC;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .dark .tri{border-left-color:#0B0B0C}
  .tb{font:700 14px/1 'JB'}
</style></head><body>

<div class="wrap">
  <div class="cap">Вариант Б · светлая тема</div>
  <div class="phone paper">
    <div class="hdr"><span class="word">КИШЛАК</span><span class="num">03 / 116</span></div>
    <div class="cass">
      <div class="row"><span class="mono">КИШЛАК</span><span class="monoDim">№0341</span></div>
      <div class="tech">ЛЯГУШАЧИЙ БЛЮЗ</div>
      <div class="win"><div class="full"><div class="hub"></div></div><div class="tape"></div><div class="empty"></div></div>
      <div class="row" style="margin-top:12px"><span class="mono">11:11 · 2020</span><span class="monoDim">C-60</span></div>
    </div>
    <div class="bar"><i></i></div>
    <div class="times"><span>0:44</span><span>-1:15</span></div>
    <div class="tr"><span class="tb">◀◀</span><div class="pb"><div class="tri"></div></div><span class="tb">▶▶</span></div>
  </div>
</div>

<div class="wrap">
  <div class="cap">Вариант Б · тёмная тема</div>
  <div class="phone dark">
    <div class="hdr"><span class="word">КИШЛАК</span><span class="num">03 / 116</span></div>
    <div class="cass">
      <div class="row"><span class="mono">КИШЛАК</span><span class="monoDim">№0341</span></div>
      <div class="tech">ЛЯГУШАЧИЙ БЛЮЗ</div>
      <div class="win"><div class="full"><div class="hub"></div></div><div class="tape"></div><div class="empty"></div></div>
      <div class="row" style="margin-top:12px"><span class="mono">11:11 · 2020</span><span class="monoDim">C-60</span></div>
    </div>
    <div class="bar"><i></i></div>
    <div class="times"><span>0:44</span><span>-1:15</span></div>
    <div class="tr"><span class="tb">◀◀</span><div class="pb"><div class="tri"></div></div><span class="tb">▶▶</span></div>
  </div>
</div>

</body></html>

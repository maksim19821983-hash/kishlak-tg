name: Проверки

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы
        run: npx tsc --noEmit

      - name: Тесты
        run: npx vitest run

      - name: Сборка
        run: npm run build

      - name: Размер сборки
        run: |
          echo "dist: $(du -sh dist | cut -f1)"
          echo "файлов: $(find dist -type f | wc -l)"

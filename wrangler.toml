# Cloudflare Pages: сборка в dist, функции в functions/
name = "kishlak-tg"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# KV оставляем как резерв: функции предпочитают D1, если она привязана
[[kv_namespaces]]
binding = "STATE"
id = "dae6476e1fef47f4b467ccc10b0dbcd2"

# D1 для синхронизации: 100 000 записей в сутки бесплатно
# раскомментируй после `wrangler d1 create kishlak-sync` и подставь database_id
[[d1_databases]]
binding = "DB"
database_name = "kishlak-sync"
# database_id = "e7df503d-2a3c-42c3-926c-cdc15a1595ff"
